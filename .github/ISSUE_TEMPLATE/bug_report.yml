name: Bug report
description: Report a reproducible DSH Launcher problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, credentials, private DSH_HOME data, or conversations.
  - type: input
    id: launcher-version
    attributes:
      label: Launcher version
      placeholder: 0.1.1
    validations:
      required: true
  - type: input
    id: dsh-version
    attributes:
      label: DSH version
      placeholder: 0.1.0-rc.7
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
