name: Bug report
description: Report a reproducible DSH Launcher problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, credentials, private DSH_HOME data, conversations, certificates, or private update keys.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version and CPU architecture
      placeholder: Windows 11 x64 or macOS 15 arm64
    validations:
      required: true
  - type: input
    id: launcher-version
    attributes:
      label: Launcher version and Release tag
      placeholder: 0.1.8 / v0.1.8
    validations:
      required: true
  - type: input
    id: dsh-version
    attributes:
      label: DSH version
      placeholder: 0.1.1-rc.1
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version and installation source
      placeholder: 24.x / official installer, Homebrew, nvm, etc.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
